spring.config.import=optional:file:./.env[.properties],optional:file:./reports/.env[.properties]
spring.application.name=reports
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# MySQL datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/local?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
#spring.datasource.driver-class-username=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8

#JWT token
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY:}
# 1h in millisecond
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_TIME:3600000}

# Email notifications
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${APP_MAIL_FROM:no-reply@cae.local}
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.public-report.base-url=${APP_PUBLIC_REPORT_BASE_URL:http://localhost:5173}
