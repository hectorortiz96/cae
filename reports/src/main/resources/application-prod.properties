# Production-safe defaults (secrets must come from environment variables)
# If not present in Google Cloud Secret Manager, they can be provided in a .env.production file in the reports folder.

spring.config.import=optional:file:./.env.production[.properties],optional:file:./reports/.env.production[.properties]

# MySQL datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/cae?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cae}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.show-sql=false

# JWT token
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY:}
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_TIME:3600000}

# Email notifications
spring.mail.host=${MAIL_HOST:mailhog}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${APP_MAIL_FROM:no-reply@cae.local}
app.mail.enabled=${APP_MAIL_ENABLED:true}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

# Public report URLs and CORS
app.public-report.base-url=${APP_PUBLIC_REPORT_BASE_URL:https://cae-reports-front-376643686478.northamerica-south1.run.app/}
app.public-report.public-url=${APP_PUBLIC_REPORT_PUBLIC_URL:https://caereportes.cloud.run}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://cae-reports-front-376643686478.northamerica-south1.run.app,https://caereportes.cloud.run}